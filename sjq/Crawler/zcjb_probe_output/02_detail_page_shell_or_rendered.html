<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全验证</title>
    <link rel="stylesheet" type="text/css" href="css/verify.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .verify-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 420px;
            overflow: hidden;
        }
        .verify-header {
            background: #005EEC;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        .verify-header-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            fill: currentColor;
        }
        .verify-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .verify-error {
            color: #d9534f;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            align-items: center;
            gap: 6px;
            background: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 8px 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .verify-error::before {
            content: "\26A0";
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="verify-header">
            <svg class="verify-header-icon" viewBox="0 0 24 24">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
            </svg>
            安全验证
        </div>
        <div class="verify-body">
            <div class="verify-error" id="errorMsg"></div>
            <div id="captcha"></div>
        </div>
    </div>
    <script type="text/javascript" src="js/jquery.min.js" ></script>
    <script src="js/crypto-js.js"></script>
    <script src="js/ase.js"></script>
    <script src="js/verify.js" ></script>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var redirectUri = params.get('redirectUri') || '/';
            var error = params.get('error');

            if (error) {
                var errorEl = document.getElementById('errorMsg');
                errorEl.textContent = '验证失败，请重新完成验证';
                errorEl.style.display = 'flex';
            }

            if (!redirectUri || redirectUri === '/') {
                document.getElementById('captcha').innerHTML = '<p>缺少 redirectUri 参数，<a href="/">返回首页</a></p>';
                return;
            }

            $('#captcha').pointsVerify({
                baseUrl: window.location.origin + '/cms',
                mode:'fixed',
                imgSize : {       //图片的大小对象,有默认值{ width: '310px',height: '155px'},可省略
                    width: '400px',
                    height: '200px',
                },
                barSize:{          //下方滑块的大小对象,有默认值{ width: '310px',height: '50px'},可省略
                    width: '400px',
                    height: '40px',
                },
                ready : function() {  //加载完毕的回调
                },
                success : function(params) { //成功的回调
                    var captchaVerification = params.captchaVerification;
                    $.ajax({
                        type: 'POST',
                        url: window.location.origin + '/cms/captcha/complete',
                        data: {
                            captchaVerification: captchaVerification,
                            redirectUri: redirectUri
                        },
                        success: function(res) {
                            if (res.code == 0 && res.res.repCode === '0000') {
                                window.location.href = res.res.repData
                            } else {
                                alert('验证失败！')
                            }
                        },
                        error: function() {
                            alert('验证提交失败，请刷新页面重试');
                        }
                    });
                },
                error : function() {        //失败的回调
                }
            });
        })();
    </script>
</body>
</html>
